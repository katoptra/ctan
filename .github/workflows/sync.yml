name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline, e.g. "RECONCILE=true MAX_BATCHES=8"'
        type: string
        default: ''
permissions:
  contents: read
  # The sync workflow of lib uses this permission to start the next run of a chain. Only
  # this file can set it.
  actions: write
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@fbe4a0d42066b9f50a2ce5a4938889dd2c52d0f7 # v2.8.0
    with: {vars: '${{ inputs.vars }}'}
    secrets: inherit
