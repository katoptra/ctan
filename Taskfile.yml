# This Taskfile makes an hourly mirror of all the files in CTAN, in a Cloudflare R2
# bucket. Each run compares the listing of the CTAN master with the state that the
# previous run put in the bucket.
#
# The toolbox and the rsync engine are parts of katoptra/lib. This file includes them at
# v2, with `flatten: true`. The README of lib gives the items that each one supplies.
#
# The items in this file are for this mirror only:
#   - the values that identify the mirror
#   - INDEX and PAGE_FOOT, for the directory pages
#   - CANARY, a file that the engine reads through the domain to find the HTML rewriters
#     of the zone
#   - FRESH_KEY and FRESH_HOURS, for the check of the clock of the master
#
# The secrets are the names in op.env. op run gets their values from the vault in
# 1Password. The values go into the image by name, not on a command line. The AWS CLI
# uses the three AWS_* values for access to R2.
version: '3'

vars:
  # The CTAN master. The CTAN page for new mirrors tells them to use it.
  SOURCE: rsync://rsync.dante.ctan.org/CTAN/
  HOST: ctan.katoptra.org                       # a fork changes this line
  # The name of the bucket. The objects are at its root, with the same paths as in CTAN.
  BUCKET: ctan
  TL: systems/texlive/tlnet                     # the only signed subtree
  TL_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC   # tug.org/texlive/verify.html
  # If upstream has more than this number of decimal GB, the run stops.
  CEILING_GB: 200
  # A listing with a smaller number of lines than this is a truncated listing. CTAN has
  # approximately 514k files.
  LIST_FLOOR: 460000
  # The key suffix of the directory pages. It must agree with the Transform Rule of the
  # zone. The bucket keeps the page, not an upstream file with this name.
  INDEX: '{{.HOST}}.directory.index.html'
  # The HTML at the end of each directory page. %s is the encoded path of the directory.
  PAGE_FOOT: '<a href="https://ctan.org/tex-archive/%s">This directory on ctan.org</a>. Sizes in bytes, times as CTAN lists them.'
  # A file with 8 http:// links and 3 mailto: addresses.
  CANARY: biblio/bibtex/contrib/german/dinat/dinat-index.html
  # The master writes its clock in this file hourly. mirmon also reads the file.
  FRESH_KEY: timestamp
  # The mirror is hourly. Thus, if the clock does not change for six hours, upstream or
  # SOURCE stopped. A slow run does not cause that.
  FRESH_HOURS: 6

includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
    flatten: true
    vars:
      NAME: ctan
      DESC: an hourly mirror of {{.SOURCE}} at https://{{.HOST}}/
  rsync:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/engines/rsync.yml
    flatten: true
