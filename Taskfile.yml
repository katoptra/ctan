# Mirror all of CTAN into a Cloudflare R2 bucket, hourly, from a list diff: dante's listing
# against the state the last run left in the bucket. The toolbox, which starts a run,
# contains it in an image, resolves its secrets, renders and checks it, and reports it, and
# the rsync engine, which moves the bytes, draws the directory pages, reads them back and
# orders the pipeline, are katoptra/lib's, included below at v2 and flattened into this
# file. What is here is the mirror's own: its identity, the line every directory page
# closes on, and the file the engine reads through the domain to catch the zone's HTML
# rewriters. R2 is reached through the AWS CLI, configured by the three AWS_* variables
# op.env resolves from 1Password, which cross into the image by name.
version: '3'

vars:
  SOURCE: rsync://rsync.dante.ctan.org/CTAN/   # the master; the register page asks for it
  HOST: ctan.katoptra.org                       # a fork changes this line
  BUCKET: ctan                                  # bucket name; objects sit at its root under CTAN's own paths
  TL: systems/texlive/tlnet                     # the one signed subtree
  TL_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC   # tug.org/texlive/verify.html
  CEILING_GB: 200                               # refuse to run past this many decimal GB upstream
  LIST_FLOOR: 460000                            # a listing under this many lines is a truncated one; CTAN is ~514k files
  INDEX: '{{.HOST}}.directory.index.html'      # the page index draws in every directory; no upstream path can carry the name
  # The line every directory page closes on; %s is the directory's encoded path.
  PAGE_FOOT: '<a href="https://ctan.org/tex-archive/%s">This directory on ctan.org</a>. Sizes in bytes, times as CTAN lists them.'
  CANARY: biblio/bibtex/contrib/german/dinat/dinat-index.html   # 8 plain http:// links and 3 mailto: addresses
  FRESH_KEY: timestamp                          # the master's clock, written hourly; mirmon reads it too
  FRESH_HOURS: 6                                # an hourly mirror, so six hours old is a stall, not a slow sync

includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
    flatten: true
    vars:
      NAME: ctan
      DESC: an hourly mirror of {{.SOURCE}} at https://{{.HOST}}/
  rsync:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/engines/rsync.yml
    flatten: true
