# Mirror all of CTAN into a Cloudflare R2 bucket, hourly, from a list diff: dante's listing
# against the state the last run left in the bucket. The toolbox, which starts a run,
# contains it in an image, resolves its secrets, renders and checks it, and reports it, and
# the rsync engine, which moves the bytes and orders the pipeline, are katoptra/lib's,
# included below at v2 and flattened into this file. What is here is the mirror's own: its
# identity, the directory page every directory is served under two keys, the checks that
# read the domain back after the engine's sample, its row of the report, and the offline
# check over fixtures/. R2 is reached through the AWS CLI, configured by the three AWS_*
# repository secrets, which cross into the image by name (PASS).
version: '3'

vars:
  SOURCE: rsync://rsync.dante.ctan.org/CTAN/   # the master; the register page asks for it
  HOST: ctan.ijosh.com                          # a fork changes this line
  BUCKET: ctan                                  # bucket name; objects sit at its root under CTAN's own paths
  TL: systems/texlive/tlnet                     # the one signed subtree
  TL_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC   # tug.org/texlive/verify.html
  CEILING_GB: 200                               # refuse to run past this many decimal GB upstream
  LIST_FLOOR: 400000                            # a listing under this many lines is a truncated one; CTAN is ~511k files
  INDEXED: .state/indexed.txt.xz               # the state as the directory pages last showed it
  INDEX: '{{.HOST}}.directory.index.html'      # the page index draws in every directory; no upstream path can carry the name

env:
  AWS_CONFIG_FILE: '{{.ROOT_DIR}}/aws.config'

# Two includes, one namespace. A verb both an include and this file define is a parse
# error unless the include excludes it: the report hooks, and the two engine hooks this
# mirror fills. MAX_BATCHES, BATCH_GB and RECONCILE are the engine's inline defaults, so
# a run sets them: task sync -- MAX_BATCHES=8 RECONCILE=true.
includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
    flatten: true
    excludes: [report-engine, report-mirror]
    vars:
      NAME: ctan
      DESC: an hourly mirror of {{.SOURCE}} at https://{{.HOST}}/
      IMAGE: ghcr.io/katoptra/toolbox:rsync-v2
      PASS: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL
      MENU: >-
        ""
        "${c}offline checks -- no network, no credentials, inside the image, over fixtures/${r}"
        "  task run -- task offline  The read-back checks, then the directory pages, over a canned hour"
        "  ${d}the engine's own checks: cd ../lib/examples/rsync && task run -- task offline${r}"
  rsync:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/engines/rsync.yml
    flatten: true
    excludes: [index, smoke-mirror]

tasks:
  pages:
    desc: RUN/indexed.txt against RUN/applied.txt -> a page under both of its keys for every directory a changed line touches, RUN/index-gone.txt for the keys of directories that emptied
    set: [pipefail]
    vars:
      # Every page is written under two keys: <dir>/INDEX, which the zone's rewrite serves for a
      # directory URL, and <dir> without its trailing slash, which serves the same URL written
      # without one, where every other mirror answers 301. No filesystem holds both a/b and
      # a/b/, so the second copies stage one tree per directory depth and upload a tree at a time.
      SLASH: '{{.RUN}}/slash'
    cmds:
      - mkdir -p {{.STAGING}} {{.SLASH}} && find {{.STAGING}} {{.SLASH}} -mindepth 1 -delete
      # A page changes when a file in its directory or a directory below it appears, changes
      # or goes, so every ancestor of every changed line is redrawn. ponytail: about five
      # pages per touched directory where one would often do; ceiling is Class A, a few
      # hundred a day against a million free. Upgrade: comm the directory sets of the two
      # files and redraw a parent only for a new or gone child.
      - >-
        LC_ALL=C comm -3 {{.RUN}}/indexed.txt {{.RUN}}/applied.txt | awk -F'\t' '{ print ($1 == "" ? $2 : $1) }'
        | {{.ANCESTORS}} | LC_ALL=C sort > {{.RUN}}/index-dirty.txt
      - '{{.ANCESTORS}} {{.RUN}}/applied.txt | LC_ALL=C sort > {{.RUN}}/index-dirs.txt'
      # A gone directory takes both of its keys with it. The root has no slashless key.
      - >-
        LC_ALL=C comm -23 {{.RUN}}/index-dirty.txt {{.RUN}}/index-dirs.txt
        | awk -v i="{{.INDEX}}" '{ print $0 i } $0 != "" { print substr($0, 1, length($0) - 1) }' > {{.RUN}}/index-gone.txt
      - LC_ALL=C comm -12 {{.RUN}}/index-dirty.txt {{.RUN}}/index-dirs.txt > {{.RUN}}/index-make.txt
      - test ! -s {{.RUN}}/index-make.txt || awk -v s="{{.STAGING}}/" '{ print s $0 }' {{.RUN}}/index-make.txt | tr '\n' '\0' | xargs -0 mkdir -p
      # SLASH/<depth>/ holds the slashless copies of the pages at that depth. Every file in
      # one tree has the same number of components, so no file is another's parent directory
      # and the tree can be uploaded whole. -r because the root is the one directory with no
      # slashless key: an hour whose only dirty directory is the root -- root files alone, or
      # a deletion that leaves no dirty directory still standing -- gives this awk nothing to
      # print, and xargs without it runs mkdir once with no operands.
      - >-
        test ! -s {{.RUN}}/index-make.txt ||
        awk -v r="{{.SLASH}}/" '$0 != "" { n = split($0, c, "/"); d = ""
          for (i = 1; i < n - 1; i++) d = d c[i] "/"; print r (n - 1) "/" d }' {{.RUN}}/index-make.txt \
        | LC_ALL=C sort -u | tr '\n' '\0' | xargs -0r mkdir -p
      # Entries, "dir TAB d|f TAB name TAB size TAB mtime", from the state: what the bucket
      # holds, never upstream. Sorted, a directory's lines are contiguous with its
      # subdirectories first, so each page is written once and closed. Names are
      # percent-encoded in href and HTML-escaped in text (9 carry & < >). The page is built
      # whole and written under both of its keys, so the two are the same bytes; the base
      # href is what lets one document serve /dir/ and /dir alike, where a relative href
      # would otherwise resolve against the parent for the second.
      - >-
        test ! -s {{.RUN}}/index-make.txt ||
        awk -F'\t' -v OFS='\t' 'NR == FNR { want[$0] = 1; next }
          { n = split($1, c, "/"); d = ""
            for (i = 1; i < n; i++) { if ((d in want) && !((d c[i]) in seen)) { seen[d c[i]] = 1; print d, "d", c[i], "", "" }; d = d c[i] "/" }
            if (d in want) print d, "f", c[n], $2, $3 }' {{.RUN}}/index-make.txt {{.RUN}}/applied.txt \
        | LC_ALL=C sort | awk -F'\t' -v S="{{.STAGING}}/" -v R="{{.SLASH}}/" -v I="{{.INDEX}}" '{{.URLENC}}
          function esc(s) { gsub(/&/, "\\&amp;", s); gsub(/</, "\\&lt;", s); gsub(/>/, "\\&gt;", s); gsub(/"/, "\\&quot;", s); return s }
          function open(d) { cur = d; live = 1
            p = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Index of /" esc(d) "</title>\n"
            p = p "<base href=\"/" enc(d) "\">\n"
            p = p "<style>body{font-family:monospace;margin:2em}td,th{text-align:left;padding:0 1.5em 0 0}</style></head><body>\n"
            p = p "<h1>Index of /" esc(d) "</h1><table><tr><th>Name</th><th>Last modified</th><th>Size</th></tr>\n"
            if (d != "") p = p "<tr><td><a href=\"../\">../</a></td><td></td><td></td></tr>\n" }
          function shut(  f, b, k, e) { p = p "</table><p><a href=\"https://ctan.org/tex-archive/" enc(cur) "\">This directory on ctan.org</a>. Sizes in bytes, times as CTAN lists them.</p></body></html>\n"
            f = S cur I; printf("%s", p) > f; close(f)
            if (cur != "") { b = substr(cur, 1, length(cur) - 1); k = split(b, e, "/")
              f = R k "/" b; printf("%s", p) > f; close(f) } }
          !live || $1 != cur { if (live) shut(); open($1) }
          $2 == "d" { p = p "<tr><td><a href=\"" enc($3) "/\">" esc($3) "/</a></td><td></td><td></td></tr>\n"; next }
          { p = p "<tr><td><a href=\"" enc($3) "\">" esc($3) "</a></td><td>" $5 "</td><td>" $4 "</td></tr>\n" }
          END { if (live) shut() }'

  index:
    desc: Redraw the directory pages this run changed and publish them; INDEXED, the state the pages last showed, moves forward only after they landed
    set: [pipefail]
    vars:
      SLASH: '{{.RUN}}/slash'
    cmds:
      # No INDEXED means no page has been drawn: every directory is drawn once, about 27k
      # PutObjects and ten minutes, and the file exists from then on.
      - {task: pull, vars: {KEY: '{{.INDEXED}}', OUT: '{{.RUN}}/indexed.txt', MISSING: ': > {{.RUN}}/indexed.txt'}}
      - {task: pages}
      # cp --recursive guesses text/html from the suffix. The pages stay in staging for smoke;
      # the next run's split clears them. Not appended to publish.txt: smoke sizes that
      # sample against upstream, which has no pages.
      - test ! -s {{.RUN}}/index-make.txt || aws s3 cp {{.AWS_FLAGS}} --recursive {{.STAGING}}/ {{.S3}}/
      # One upload per depth, because no single tree holds both a/b and a/b/. A slashless key
      # carries no suffix to guess from, so the type is given: without it the CLI sends
      # binary/octet-stream and a browser downloads the page instead of drawing it.
      - >-
        for d in {{.SLASH}}/*/; do test -d "$d" || continue;
        aws s3 cp {{.AWS_FLAGS}} --recursive --content-type text/html "$d" {{.S3}}/; done
      - {task: remove, vars: {K: '{{.RUN}}/index-gone.txt'}}
      # The pages now show the state, and the bucket already holds it: checkpoint put it there
      # before this verb ran. One server-side copy moves INDEXED forward; no bytes leave the
      # runner. A run that dies before this line redraws the same pages next hour.
      - aws s3 cp {{.AWS_FLAGS}} {{.S3}}/{{.STATE}} {{.S3}}/{{.INDEXED}}

  smoke-mirror:
    desc: After the engine's sample, one redrawn page read back under both of its keys, the HTML canary against the bucket, and a Perl client not turned away
    vars:
      # The Perl check names /timestamp and asks for it only once the state says it landed.
      # It rides the decision batch, the last one, so a first fill capped at MAX_BATCHES has
      # not reached it and the bucket answers 404 to a key it has never held; the hour it
      # lands and every hour after name it. Empty is the only falsy value, so the path is
      # both the flag and the key.
      TS:
        sh: awk -F'\t' '$1 == "timestamp" { print $1 }' {{.RUN}}/applied.txt 2>/dev/null || true
    cmds:
      # One redrawn page under both of its keys, read back by key (no zone rule needed) and
      # sized against the copy still in staging, the same one-byte ranged read as the engine's
      # sample. Both keys hold the same bytes, so one staged copy sizes both. The root is
      # drawn but has no slashless key, and / is CTAN's own index.html.
      # ${d} in braces: the INDEX that follows it opens with a letter, and $d{{.INDEX}} names
      # a variable that does not exist. test -n makes that a stated failure, not a size of "".
      # The slashless key is read only over http: the offline harness serves the pages off a
      # filesystem, which cannot hold both a/b and a/b/, the same fact the second key rests on.
      - >-
        test ! -s {{.RUN}}/index-make.txt || { d=$(tail -1 {{.RUN}}/index-make.txt);
        want=$(wc -c < "{{.STAGING}}/${d}{{.INDEX}}" | tr -d ' '); test -n "$want";
        case "{{.URL}}" in http*) b=1 ;; *) b=0 ;; esac;
        printf '%s\n' "$d" | awk -v i="{{.INDEX}}" -v b="$b" '{ print $0 i } b == 1 && $0 != "" { print substr($0, 1, length($0) - 1) }'
        | {{.ENCODE}} | while IFS="$(printf '\t')" read -r k u; do
        got=$({{.CURL}} -r 0-0 -D - -o /dev/null "{{.URL}}/$u" | {{.SIZE}});
        echo "$k: $got bytes (page: $want)"; test "$got" = "$want" || exit 1; done; }
      # Cloudflare's HTML rewriters sit between R2 and the client, so what finds them is the
      # object compared with what the domain serves. A size check is not enough: measured
      # 2026-08-28, Automatic HTTPS Rewrites lengthened a link by a byte while the parser it
      # runs in collapsed a newline inside the same tag, leaving the length unchanged and the
      # bytes different. This path carries 8 plain http:// links and 3 mailto: addresses, so
      # HTTPS Rewrites, Email Obfuscation and Rocket Loader each alter it. Skipped over
      # file://, which has no bucket to read, and whenever the path is not in the state.
      - >-
        h=biblio/bibtex/contrib/german/dinat/dinat-index.html;
        n=$(awk -F'\t' -v k="$h" '$1 == k { print $2 }' {{.RUN}}/applied.txt);
        case "{{.URL}}" in http*) ;; *) n= ;; esac;
        if test -z "$n"; then echo "html canary skipped ($h is not in the state, or the URL is not http)"; else
        aws s3 cp {{.AWS_FLAGS}} {{.S3}}/$h {{.RUN}}/canary.html &&
        {{.CURL}} {{.URL}}/$h | cmp - {{.RUN}}/canary.html &&
        echo "$h: $n bytes, the edge serves what the bucket holds"; fi
      # Browser Integrity Check answers 403 to libwww-perl, LWP, Python-urllib and PycURL,
      # which every other CTAN mirror serves; a zone rule turns it off for this hostname
      # alone, and nothing else in the run would notice it coming back. tlmgr is outside that
      # set -- TLDownload.pm sets agent => "texlive/lwp" -- but the archive's own Perl and
      # Python clients are not. CURL carries -f, so the 403 is the failure.
      - '{{if .TS}}{{.CURL}} -A "libwww-perl/6.67" -o /dev/null {{.URL}}/timestamp && echo "timestamp: served to a libwww-perl client"{{else}}echo "perl client check skipped (timestamp has not landed yet)"{{end}}'

  report-mirror:
    desc: The mirror's row of the run summary, after the toolbox's and the engine's
    internal: true
    silent: true
    cmds:
      - |
        n() { test -f "$1" && wc -l < "$1" || echo 0; }
        echo "| Directory pages | $(n {{.RUN}}/index-make.txt) redrawn under both keys, $(n {{.RUN}}/index-gone.txt) keys removed |" >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

  offline:
    desc: smoke, then pages, over fixtures/run-root copied under .run, inside the image; no network, no credentials
    vars:
      F: '{{.RUN}}/fixtures/run-root'
    cmds:
      # The verbs write beside what they read, so they work on a copy.
      - mkdir -p {{.RUN}} && rm -rf {{.RUN}}/fixtures && cp -R {{.ROOT_DIR}}/fixtures {{.RUN}}/fixtures
      # The read-back first: pages empties staging. Over file:// the engine samples the
      # timestamp the fixture staged and smoke-mirror sizes the page it staged, by the INDEX
      # key alone; a filesystem cannot hold the slashless key beside it.
      - {task: smoke, vars: {RUN: '{{.F}}', STAGING: '{{.F}}/staging', URL: 'file://{{.F}}/staging'}}
      # run-root: the hour whose only change is timestamp, so its one dirty directory is the
      # root, which has no slashless key: one page, an empty slash tree, no key removed.
      - {task: pages, vars: {RUN: '{{.F}}', STAGING: '{{.F}}/staging'}}
      - test "$(cat {{.F}}/index-make.txt)" = "" && test -s {{.F}}/staging/{{.INDEX}} && test ! -s {{.F}}/index-gone.txt && test -z "$(ls -A {{.F}}/slash)"
      - 'echo "offline: every check passed"'
